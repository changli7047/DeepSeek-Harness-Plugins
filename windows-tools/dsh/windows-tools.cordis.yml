# windows-tools 的 DeepSeek Harness (dsh) 覆盖层模板。
#
# 用法：
#   1. 将下方 <> 占位符替换为本仓库中 dsh/windows-tools.ts 的【绝对路径】；
#   2. 启动时传入覆盖层：  dsh web --patch <本文件路径>
#      或把 insert 行搬进目标 profile 的 cordis.patch.yml 里常驻加载；
#   3. 重启服务后，启动日志不得出现 "did not activate"。
- insert:
    - id: windows-tools
      name: '<ABSOLUTE_PATH_TO_REPO>/windows-tools/dsh/windows-tools.ts'
